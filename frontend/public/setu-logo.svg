<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="setuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield/Tile -->
  <rect width="100" height="100" rx="24" fill="url(#setuGrad)"/>
  
  <!-- Bridge Arch & Pillars (Setu) -->
  <!-- Top Bridge Deck -->
  <rect x="18" y="44" width="64" height="6" rx="3" fill="#ffffff"/>
  <!-- Main Suspension Arch -->
  <path d="M 22 50 Q 50 24 78 50" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Arch Cable Vertical Ties -->
  <line x1="36" y1="38" x2="36" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="34" x2="50" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="38" x2="64" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Foundation Pillars -->
  <rect x="22" y="50" width="8" height="24" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="70" y="50" width="8" height="24" rx="2" fill="#ffffff" opacity="0.9"/>
  <!-- River Water Waves (Tricolor subtle saffron/white/green reflection or cyan) -->
  <path d="M 16 78 Q 33 74 50 78 T 84 78" fill="none" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  <!-- Ashoka Chakra / Golden Sun / Sparkle at center crown -->
  <circle cx="50" cy="24" r="3.5" fill="#fbbf24"/>
</svg>
